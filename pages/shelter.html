<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Animal Shelter Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="shelter.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="/" class="brand">
      <img class="logo" src="asset/img/ci4.svg" alt="Life Bridge 로고" />
    </a>

    <nav class="main-nav">
      <ul class="nav-list">
        <li><a href="/">홈</a></li>
        <li><a href="/shelters">보호소</a></li>
        <li><a href="/animals">입양동물</a></li>
        <li><a href="/pages/foster.html">임시보호자</a></li>
      </ul>
    </nav>

    <div class="auth-actions">
      <a href="/login">로그인</a>
      <a href="/signup" class="btn-primary">회원가입</a>
    </div>
  </div>
</header>

<!-- =======================
     DASHBOARD SECTION
======================= -->
<section class="section dashboard-section">
  <div class="title-box">
    <h1>Our animal shelter</h1>
  </div>

  <div class="dashboard-box">
    <div class="circle-wrap">

      <div class="circle">
        <canvas id="pressureChart"></canvas>
        <div class="circle-value" data-value="97" data-unit="%">0%</div>
        <span>압박지수</span>
      </div>

      <div class="circle">
        <canvas id="localRateChart"></canvas>
        <div class="circle-value" data-value="17.8" data-unit="%">0%</div>
        <span>지역 보호율</span>
      </div>

      <div class="circle">
        <canvas id="gyeonggiRateChart"></canvas>
        <div class="circle-value" data-value="20.2" data-unit="%">0%</div>
        <span>지역대비 보호율</span>
      </div>

      <div class="circle">
        <canvas id="countChart"></canvas>
        <div class="circle-value" data-value="194" data-unit="%">0%</div>
        <span>보호 동물 수</span>
      </div>

    </div>
  </div>
</section>

  <div class="main-card">
    <div class="image-box">
      <div id="kakaoMap" style="width:100%; height:100%;"></div>
    </div>
    <div class="content-box"></div>
  </div>
</section>

<!-- =======================
     SHELTER LIST
======================= -->
<section class="section">
  <h2>보호소 목록</h2>

  <div class="filter-row">
    <select id="provinceSelect">
      <option value="">시/도 선택</option>
    </select>

    <select id="citySelect" disabled>
      <option value="">시/군/구 선택</option>
    </select>
  </div>

  <div class="tag-row" id="sortTags">
    <button class="tag active" data-sort="pressure">압박 지수</button>
    <button class="tag" data-sort="count">보호 동물 수</button>
    <button class="tag" data-sort="free">여유도</button>
    <button class="tag" data-sort="urgency">입양 시급도</button>
  </div>

  <div id="cardContainer" class="card-grid"></div>
  <div id="pagination" class="pagination"></div>
</section>

<!-- =======================
     MODAL
======================= -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modalCloseBtn">×</button>
    <h3>보호소 상세</h3>
    <p id="modalContent"></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=5f82fa0d2d8e017640cd39532133f49b&libraries=services"></script>

<script src="shelter.js"></script>

</body>
</html>
